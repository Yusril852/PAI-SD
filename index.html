<script>
let LV=1;const $=s=>document.querySelector(s),pick=a=>a[Math.floor(Math.random()*a.length)],sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]),ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const NM=['Aisyah','Fatih','Zahra','Hafidz','Naila','Rayyan','Salsabila','Umar','Khadijah','Yusuf','Alya','Faris'],nm=()=>pick(NM),

sid=x=>x.toLocaleString('id-ID');
/* ============ MESIN SOAL BERBASIS FAKTA ============ */
function dis(F,i){const a=F[i][1],w=F[i][2];
 if(Array.isArray(w))return sh(w.filter(x=>x!=a)).slice(0,3);
 const m=/^(\d+)(.*)$/.exec(a);
 if(m){const n=+m[1],sx=m[2],st=Math.max(1,Math.round(n/10)),c=[];[-1,1,-2,2,3,-3,4,5].forEach(k=>{const v=n+k*st;if(v>0&&v!=n)c.push(v+sx)});return sh([...new Set(c)]).slice(0,3)}
 const nn=f=>!/^\d/.test(f[1]);
 let o=sh(F.filter((f,j)=>j!=i&&f[1]!=a&&nn(f)&&!Array.isArray(f[2])&&f[2]===w).map(f=>f[1]));
 if(o.length<3)o=o.concat(sh(F.filter((f,j)=>j!=i&&f[1]!=a&&nn(f)&&!o.includes(f[1])).map(f=>f[1])));
 return[...new Set(o)].slice(0,3)}
const QF=(q,a,w,e,id,g)=>{w=[...new Set(w)].filter(x=>x!=a).slice(0,3);return{q,a,e:e||'Jawaban yang tepat adalah '+a+'.',g:g||'',id,o:sh([a,...w])}};
const PRE=()=>pick(['Ustazah bertanya kepada '+nm()+':','Saat pelajaran PAI, '+nm()+' membaca soal:',nm()+' dan teman-teman bermain kuis di masjid. Pertanyaannya:','Di rumah, '+nm()+' membuka buku PAI. Ada soal:','Dalam lomba cerdas cermat PAI, juri bertanya:'])+'<br>';
let U=0;
const SBF=(n,m,F,P,X)=>{X=X||[];const u='s'+(++U)+'_',N=F.length,nx=X.length,
 qf=i=>P?P[0](F[i][0]):F[i][0],
 rs=i=>P?P[1](F[i][1]):'Jawaban “'+F[i][1]+'” tepat untuk pertanyaan...',
 ro=i=>P&&P[2]?P[2](F[i][0]):F[i][0],an=i=>F[i][1],
 oth=(i,k)=>sh([...Array(N).keys()].filter(x=>x!=i)).slice(0,k);
 return{n,m,N,F,g:()=>{const L=LV,i=ri(0,N-1);
  if(nx&&Math.random()<nx/(2*N+nx)){const k=ri(0,nx-1),x=X[k];return QF((L==2?PRE():'')+x[0],x[1],x[2],'✔ '+x[1],u+'x'+k)}
  if(L<3){const pr=L==2?PRE():'';return Math.random()<.5?QF(pr+qf(i),an(i),dis(F,i),null,u+'f'+i):QF(pr+rs(i),ro(i),oth(i,3).map(ro),null,u+'r'+i)}
  const t=ri(0,2);
  if(t==0){const j=oth(i,1)[0],k=oth(i,N).filter(x=>x!=j)[0];
   return QF('Pasangkan dengan benar!<br>(1) '+ro(i)+'<br>(2) '+ro(j),'(1) '+an(i)+' · (2) '+an(j),['(1) '+an(j)+' · (2) '+an(i),'(1) '+an(i)+' · (2) '+an(k),'(1) '+an(k)+' · (2) '+an(j)],'✔ '+ro(i)+' → '+an(i)+'; '+ro(j)+' → '+an(j),u+'m'+i+'-'+j)}
  if(t==1){const j=oth(i,1)[0];
   return QF('Pasangan berikut yang <b>SALAH</b> adalah...',ro(i)+' → '+an(j),oth(i,3).map(k=>ro(k)+' → '+an(k)),'Yang benar: '+ro(i)+' → '+an(i),u+'b'+i+'-'+j)}
  return QF('Pasangan berikut yang <b>BENAR</b> adalah...',ro(i)+' → '+an(i),oth(i,3).map(k=>ro(k)+' → '+an((k+ri(1,N-1))%N)),'Yang benar: '+ro(i)+' → '+an(i),u+'c'+i)}}};
const T={},add=(g,n,m,F,P,X)=>(T[g]=T[g]||[]).push(SBF(n,m,F,P,X));
const AREA=['Al-Qur\'an','Aqidah','Fikih','Kisah Teladan','Akhlak'],AI=['📖','☪️','🕌','🌙','💝'],
ALLG=[1,2,3,4,5,6].flatMap(k=>[1,2,3,4,5].map(a=>k*10+a)),
gname=g=>g>100?'Ulangan Kelas '+(g-100):'Kelas '+Math.floor(g/10)+' · '+AREA[g%10-1],
grd=k=>Math.min(6,Math.max(1,parseInt(k)||1)),

/* ---- KELAS 1 ---- */
add(11,'Mengenal Huruf Hijaiyah','Huruf hijaiyah ada 28 dan dibaca dari kanan ke kiri. Al-Qur\'an ditulis dengan huruf hijaiyah. Contoh: ا dibaca Alif, ب dibaca Ba, ت dibaca Ta, ث dibaca Tsa, ج dibaca Jim.',
 [['ا','Alif'],['ب','Ba'],['ت','Ta'],['ث','Tsa'],['ج','Jim'],['ح','Ha'],['خ','Kha'],['د','Dal'],['ذ','Dzal'],['ر','Ra'],['ز','Zai'],['س','Sin'],['ش','Syin'],['ص','Shad'],['ض','Dhad']],
 [s=>'Huruf hijaiyah '+s+' dibaca...',a=>'Huruf hijaiyah yang dibaca “'+a+'” adalah...',s=>s],
 [['Huruf hijaiyah dibaca dari arah...','Kanan ke kiri',['Kiri ke kanan','Atas ke bawah','Bawah ke atas']],['Berapa jumlah huruf hijaiyah?','28',['26','29','30']]]);
add(11,'Harakat: Fathah, Kasrah, Dhammah','Harakat adalah tanda baca pada huruf hijaiyah. Fathah (garis miring di atas) berbunyi “a”. Kasrah (garis miring di bawah) berbunyi “i”. Dhammah (tanda seperti waw kecil di atas) berbunyi “u”. Sukun adalah tanda mati.',
 HLT.flatMap(([c,r])=>HKT.map(([h,v])=>[c+h,r+v])),
 [s=>'Huruf '+s+' dibaca...',a=>'Bacaan “'+a+'” ditulis...',s=>s],
 [['Harakat yang berbunyi “a” disebut...','Fathah',['Kasrah','Dhammah','Sukun']],['Harakat yang berbunyi “i” disebut...','Kasrah',['Fathah','Dhammah','Sukun']],['Harakat yang berbunyi “u” disebut...','Dhammah',['Fathah','Kasrah','Sukun']],['Harakat kasrah ditulis di... huruf','Bawah',['Atas','Depan','Tengah']],['Tanda mati pada huruf hijaiyah disebut...','Sukun',['Fathah','Kasrah','Dhammah']]]);
add(11,'Surah Al-Fatihah dan Al-Ikhlas','Al-Fatihah artinya “Pembukaan”, berjumlah 7 ayat, dan dibaca di setiap rakaat salat. Al-Ikhlas berjumlah 4 ayat dan menjelaskan bahwa Allah Maha Esa. Hafalkan sedikit demi sedikit dan pahami artinya.',
 [['Arti “Alhamdulillahi rabbil ‘alamin” adalah...','Segala puji bagi Allah, Tuhan semesta alam','a'],['Arti “Ar-Rahmanir rahim” adalah...','Maha Pengasih lagi Maha Penyayang','a'],['Arti “Maliki yaumid din” adalah...','Raja hari pembalasan','a'],['Arti “Iyyaka na‘budu wa iyyaka nasta‘in” adalah...','Hanya kepada-Mu kami menyembah dan memohon pertolongan','a'],['Arti “Ihdinash shirathal mustaqim” adalah...','Tunjukilah kami jalan yang lurus','a'],['Arti “Qul huwallahu ahad” adalah...','Katakanlah, Allah Maha Esa','a'],['Arti “Allahush shamad” adalah...','Allah tempat bergantung segala sesuatu','a'],['Arti “Lam yalid wa lam yulad” adalah...','Allah tidak beranak dan tidak diperanakkan','a'],['Arti “Wa lam yakun lahu kufuwan ahad” adalah...','Tidak ada satu pun yang setara dengan Allah','a'],

add(12,'Rukun Islam dan Rukun Iman','Rukun Islam ada 5: syahadat, salat, zakat, puasa Ramadan, dan haji bagi yang mampu. Dua kalimat syahadat: bersaksi bahwa tiada Tuhan selain Allah dan Nabi Muhammad saw. utusan Allah. Rukun Iman ada 6; yang pertama iman kepada Allah dan yang keempat iman kepada rasul-rasul Allah.',

add(21,'Surah An-Nas, Al-Falaq, dan Al-\'Asr','An-Nas (6 ayat) memohon perlindungan kepada Tuhan, Raja, dan Sembahan manusia. Al-Falaq (5 ayat) memohon perlindungan dari kejahatan makhluk. Al-\'Asr (3 ayat) mengingatkan agar kita tidak merugi: beriman, beramal saleh, saling menasihati dalam kebenaran dan kesabaran.',

add(55,'Sederhana, Ikhlas, dan Pantang Menyerah','Hidup sederhana: secukupnya, tidak berlebihan. Ikhlas: beramal semata karena Allah, bukan untuk pujian (riya). Pantang menyerah: terus berusaha dan berdoa saat gagal.',

add(61,'Surah Al-Kafirun, Al-Ma\'idah 2-3, Al-Hujurat 12','Al-Kafirun (6 ayat) mengajarkan toleransi: “Untukmu agamamu, untukku agamaku”. Al-Ma\'idah ayat 2: tolong-menolong dalam kebaikan dan takwa, bukan dalam dosa. Ayat 3 menyebut makanan haram dan penyempurnaan agama. Al-Hujurat ayat 12: jauhi prasangka buruk, tajassus, dan ghibah.',

add(62,'Iman kepada Hari Kiamat, Qada dan Qadar','Hari Kiamat: berakhirnya kehidupan dunia; waktunya hanya Allah yang tahu. Malaikat Israfil meniup sangkakala. Setelah itu ada hari kebangkitan, hisab (perhitungan), mizan (penimbangan), shirath, lalu surga atau neraka. Qada ialah ketetapan Allah; qadar ialah perwujudannya. Kita wajib berikhtiar, berdoa, lalu bertawakal.',
 [['Hari Kiamat adalah hari...','Berakhirnya kehidupan di dunia',['Dimulainya kehidupan dunia','Hari libur','Hari raya']],['Malaikat yang meniup sangkakala adalah...','Malaikat Israfil',['Malaikat Jibril','Malaikat Mikail','Malaikat Izrail']],['Waktu terjadinya kiamat hanya diketahui oleh...','Allah Swt.',['Malaikat','Nabi','Ulama']],['Hari kebangkitan manusia dari kubur disebut...','Yaumul Ba\'ats','Y'],['Hari perhitungan amal disebut...','Yaumul Hisab','Y'],['Hari penimbangan amal disebut...','Yaumul Mizan','Y'],['Hari pembalasan disebut...','Yaumud Din','Y'],['Jembatan yang harus dilalui manusia di akhirat disebut...','Shirath',['Mizan','Hisab','Ba\'ats']],['Tempat balasan bagi orang beriman dan beramal saleh adalah...','Surga',['Neraka','Barzakh','Padang mahsyar']],['Kematian termasuk kiamat...','Sughra (kecil)',['Kubra (besar)','Tinggi','Sedang']],

add(63,'Makanan Halal dan Haram, Pengurusan Jenazah','Halal artinya boleh, haram artinya dilarang. Makanan harus halal zatnya dan halal cara memperolehnya. Contoh haram: babi, bangkai, darah, khamar. Mengurus jenazah hukumnya fardu kifayah: memandikan, mengafani, menyalatkan, dan menguburkan. Salat jenazah 4 takbir tanpa rukuk dan sujud.',

add(64,'Khulafaur Rasyidin dan Ashabul Kahfi','Khulafaur Rasyidin (4 khalifah): Abu Bakar ash-Shiddiq, Umar bin Khattab (Al-Faruq), Utsman bin Affan (Dzun Nurain), Ali bin Abi Thalib. Ashabul Kahfi ialah pemuda beriman yang berlindung di gua dari penguasa zalim dan tertidur 309 tahun atas kuasa Allah.',

add(65,'Husnuzzan, Simpati, Hidup Rukun, dan Persaudaraan','Husnuzzan: berprasangka baik. Simpati: ikut merasakan kesusahan orang lain. Hidup rukun: damai dengan sesama. Persaudaraan: ukhuwah Islamiyah (sesama muslim), wathaniyah (sesama bangsa), basyariyah (sesama manusia). Jika ada kabar, lakukan tabayyun (periksa kebenarannya).',

let S=null,V='home',G=11,CUR=1,P=null;
try{S=norm(JSON.parse(localStorage.getItem('pai1')));CUR=grd(S.kls)}catch(e){S=null}
const lvl=()=>Math.floor(S.xp/100)+1,day=d=>d.toISOString().slice(0,10);
const streak=()=>{let n=0,d=new Date;while(S.days.includes(day(d))){n++;d.setDate(d.getDate()-1)}return n};
const bar=v=>`<div class=bar><i style="width:${v}%"></i></div>`;
const gdone=g=>T[g].filter((_,i)=>[1,2,3].some(L=>S.p[g+'.'+i+'.'+L]!=null)).length;
function go(v,g){V=v;if(g)G=g;render();scrollTo(0,0)}
function setG(x){CUR=x;render()}
/* ============ TEMA & EFEK ============ */
const TH={taman:{n:'Taman Surga',i:'🌿',f:['🌙','⭐','☪️','🌿','🕌','✨'],a:'rise'},ramadan:{n:'Malam Ramadan',i:'🌙',f:['🏮','🌙','⭐','✨','🕌'],a:'fall'},pelangi:{n:'Pelangi Santri',i:'🌈',f:['🎈','🌈','⭐','🎉','🕌','🌟'],a:'rise'},langit:{n:'Langit Biru',i:'☁️',f:['☁️','🕊️','⭐','🕌','☁️'],a:'drift'}};
let TM='taman';try{TM=localStorage.getItem('paiTheme')||'taman'}catch(e){}if(!TH[TM])TM='taman';
const reduce=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
function fx(){const e=$('#fx');document.documentElement.dataset.theme=TM;if(!e)return;e.innerHTML='';if(reduce())return;const t=TH[TM],n=innerWidth<600?10:18;for(let k=0;k<n;k++){const i=document.createElement('i'),d=t.a=='drift';i.textContent=pick(t.f);i.style.cssText=(d?'top:'+ri(2,90)+'%;left:0':'left:'+ri(0,96)+'%;top:0')+';font-size:'+ri(18,44)+'px;animation:'+t.a+' '+ri(12,28)+'s linear -'+ri(0,28)+'s infinite';e.appendChild(i)}}
function theme(k){TM=k;try{localStorage.setItem('paiTheme',k)}catch(e){}fx();render()}
function boom(n){const e=$('#fx2');if(!e||reduce())return;const em=['⭐','✨','🌙','🎉','💚','🌟'];for(let k=0;k<n;k++){const i=document.createElement('i'),a=Math.random()*Math.PI*2,d=ri(80,320);i.textContent=pick(em);i.style.cssText='--x:'+Math.cos(a)*d+'px;--y:'+(Math.sin(a)*d-80)+'px;font-size:'+ri(16,34)+'px';e.appendChild(i);setTimeout(()=>i.remove(),1400)}}
function skc(){$('#sx').style.display=$('#sk').value=='_'?'block':'none'}
function out(){unpres();S=null;try{localStorage.removeItem('pai1')}catch(e){}go('home')}
function ans(j){if(P.a!=null)return;P.a=j;const q=P.qs[P.k],ok=q.o[j]==q.a,ak=P.g+'_'+(P.i??'x')+'_'+P.L;S.tot++;const c=S.ac[ak]||(S.ac[ak]=[0,0]);c[1]++;if(ok){c[0]++;P.ok++;S.ok++;S.xp+=10}else wrong(q);sv();render();if(ok)boom(10)}
const LN=['','🌱 Level 1 Dasar','🌿 Level 2 Cerdas Cermat','🌳 Level 3 Tantangan'];
const W={
login:()=>`<div class=card style="max-width:480px;margin:30px auto;text-align:center"><div class=big>🕌✨</div><h1>PAI SD – Belajar Islam Ceria</h1><p class=mu>Latihan Pendidikan Agama Islam kelas 1–6: 5 bidang, 3 level, 25 soal tiap level. Isi datamu untuk mulai atau lanjutkan.</p>${chips()}${db?'':'<p class=mu>📴 Mode offline: progres hanya tersimpan di perangkat ini.</p>'}<label class=lbl for=nm>Nama</label><input id=nm class=inp placeholder="Nama kamu" onkeydown="event.key=='Enter'&&login()"><label class=lbl for=kl>Kelas</label><select id=kl class=inp>${KL.map(k=>`<option value=${k}>Kelas ${k}</option>`).join('')}</select><label class=lbl for=sk>Sekolah</label><select id=sk class=inp onchange=skc()>${SK2.map(s=>`<option>${s}</option>`).join('')}<option value=_>Lainnya (tulis sendiri)…</option></select><input id=sx class=inp placeholder="Tulis nama sekolahmu" style="display:none" onkeydown="event.key=='Enter'&&login()"><button class=btn onclick=login()>Mulai belajar 🚀</button><p><button class="btn s" onclick="go('guru')">👩‍🏫 Masuk sebagai guru</button></p></div><div class=card style="max-width:480px;margin:20px auto"><h2 style="margin-top:0">🏆 Papan Peringkat</h2><div id=lb></div></div>${lbSub()}`,
home:()=>{const t=S.tot,a=t?Math.round(S.ok/t*100):0,c=k=>{const g=CUR*10+k;return`<div class="card bab b${k}" tabindex=0 onclick="go('kelas',${g})" onkeydown="event.key=='Enter'&&go('kelas',${g})"><div class=big>${AI[k-1]} ${AREA[k-1]}</div><div class=mu>${gdone(g)} dari ${T[g].length} sub-bab dicoba</div>${bar(gdone(g)/T[g].length*100)}</div>`};return`<div class=hero><div><h1>Assalamu'alaikum, ${esc(S.name)}! 👋</h1><p>Kelas ${esc(S.kls||'1')} · ${esc(S.skl||'SD')}<br>Pilih bidang, baca ringkasan materi, lalu kerjakan 3 level latihan.</p></div><div class=lv>Level ${lvl()}</div></div><div class=grid><div class=card><div class=big>🔥 ${streak()}</div><div class=mu>hari beruntun</div></div><div class=card><div class=big>${t}</div><div class=mu>soal dikerjakan</div></div><div class=card><div class=big>${a}%</div><div class=mu>akurasi</div></div><div class=card><div class=big>${S.xp}</div><div class=mu>XP</div></div></div><h2>📚 Pilih Kelas</h2><div class=gps>${[1,2,3,4,5,6].map(x=>`<button class="gp ${x==CUR?'on':''}" onclick="setG(${x})">Kelas ${x}</button>`).join('')}</div>${[1,2,3,4,5].map(c).join('')}<button class="btn y" onclick="start(${100+CUR},null,2)">🎯 Ulangan campuran Kelas ${CUR} (25 soal)</button>`},
play:()=>{const q=P.qs[P.k],a=P.a,done=a!=null,ok=done&&q.o[a]==q.a;return`<div class="row sp"><b>${gname(P.g)} · ${P.i==null?'Ulangan campuran':T[P.g][P.i].n+' · '+LN[P.L]}</b><span class=mu>Soal ${P.k+1} dari ${P.qs.length}</span></div>${bar((P.k+(done?1:0))/P.qs.length*100)}<div class=card>${q.g?`<div class=gfx>${q.g}</div>`:''}<div class=q>${ah(q.q)}</div>${q.o.map((o,j)=>`<button class="opt ${done?(o==q.a?'ok':j==a?'no':''):''}" onclick="ans(${j})">${ah(o)}</button>`).join('')}${done?`<div class="fb ${ok?'ok':'no'}">${ok?'🎉 <b>Masyaallah, benar!</b> +10 XP':'❌ <b>Belum tepat.</b> Jawaban benar: <b>'+ah(q.a)+'</b>'}${q.e?'<br>💡 '+ah(q.e):''}</div>`:''}</div>${done?`<button class=btn onclick=next()>${P.k==P.qs.length-1?'Lihat hasil':'Soal berikutnya'} →</button>`:''}`},
prog:()=>{const A=[['🎯','Langkah pertama',S.tot>0],['🔥','3 hari beruntun',streak()>=3],['💯','Nilai sempurna',!!S.perf],['⭐','500 XP',S.xp>=500],['🎓','Semua sub-bab satu bidang dicoba',ALLG.some(g=>gdone(g)==T[g].length)]];return`<h1>📊 Progress</h1>${ALLG.filter(g=>Math.floor(g/10)==CUR||gdone(g)>0).map(g=>`<div class=card><div class="row sp"><b>${gname(g)}</b><span class=mu>${gdone(g)}/${T[g].length} sub-bab</span></div>${bar(gdone(g)/T[g].length*100)}<div class=mu>${T[g].map((t,i)=>[1,2,3].some(L=>S.p[g+'.'+i+'.'+L]!=null)?t.n+': '+[1,2,3].map(L=>S.p[g+'.'+i+'.'+L]??'–').join('/')+'%':'').filter(Boolean).join(' · ')||'Belum ada latihan.'}</div></div>`).join('')}${hv(S)}<h2>Pencapaian</h2><div class=grid>${A.map(a=>`<div class=card style="${a[2]?'':'opacity:.45'}"><div class=big>${a[0]}</div><b>${a[1]}</b></div>`).join('')}</div>`}};
function render(){const lg='<div class=lg>PAI<i>Kids</i> SD</div>',tb='<span class=th>'+Object.keys(TH).map(k=>`<button class="tb ${TM==k?'on':''}" title="${TH[k].n}" aria-label="Tema ${TH[k].n}" onclick="theme('${k}')">${TH[k].i}</button>`).join('')+'</span>';if(!S&&V!='guru'&&V!='gdet')V='login';$('#sb').innerHTML=lg+(S?[['home','🏠 Beranda'],['prog','📊 Progress'],['guru','👩‍🏫 Guru'],['val','🧪 Validator']].map(x=>`<button class="${V==x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')+'<button onclick=out()>🚪 Keluar</button><div class=mu id=syn>'+synT()+'</div>':(V=='guru'||V=='gdet'?'<button onclick="go(\'login\')">🏠 Halaman siswa</button>':''))+tb;$('#app').innerHTML=W[V]()}
function start(g,i,L){P={g,i,L,qs:mk(g,i,L),k:0,ok:0,a:null};go('play')}
function next(){P.k++;if(P.k<P.qs.length){P.a=null;return go('play')}const sc=Math.round(P.ok/P.qs.length*100);P.sc=sc;S.hist.push({g:P.g,i:P.i??-1,L:P.L,sc,n:P.qs.length,t:Date.now()});if(S.hist.length>60)S.hist.shift();S.xp+=sc==100?50:20;if(P.i!=null){const key=P.g+'.'+P.i+'.'+P.L;S.p[key]=Math.max(S.p[key]||0,sc)}const d=day(new Date);if(!S.days.includes(d))S.days.push(d);if(sc==100)S.perf=1;sv();go('res');if(sc>=70)boom(50)}
W.kelas=()=>`<button class="btn s" onclick="go('home')">← Semua bidang</button><h2>${AI[G%10-1]} ${gname(G)}</h2>`+T[G].map((t,i)=>{LV=1;const ex=t.g();return`<div class=card><b>${T[G].length>1?'abcdef'[i]+'. ':''}${t.n}</b><details><summary>📖 Baca materi</summary><p>${ah(t.m)}</p><div class=ex><b>Contoh:</b> ${ah(ex.q)}<br>Jawab: <b>${ah(ex.a)}</b>. ${ah(ex.e)}</div></details><div class=row>${[1,2,3].map(L=>{const b=S.p[G+'.'+i+'.'+L];return`<button class="btn lvb l${L}" onclick="start(${G},${i},${L})">${LN[L]}<small>${b!=null?'⭐'.repeat(b>=90?3:b>=70?2:b>=40?1:0)+' '+b+'%':'25 soal'}</small></button>`}).join('')}</div></div>`}).join('')+`<button class="btn y" onclick="start(${G},null,2)">🎯 Ulangan campuran (25 soal)</button>`;
W.res=()=>`<div class="card" style="text-align:center"><div class=big style="font-size:3rem">${P.sc>=90?'🏆':P.sc>=70?'😄':'💪'}</div><h1>${P.sc>=90?'Masyaallah, luar biasa!':P.sc>=70?'Hebat, barakallah!':'Ayo coba lagi!'}</h1><div class=big style="font-size:3.2rem">${P.sc}</div><div style="font-size:2rem">${'⭐'.repeat(P.sc>=90?3:P.sc>=70?2:P.sc>=40?1:0)}</div>${bar(P.sc)}<p>Benar <b>${P.ok}</b> dari <b>${P.qs.length}</b> soal.</p></div><div class=row><button class=btn onclick="start(${P.g},${P.i==null?'null':P.i},${P.L})">🔄 Ulangi</button>${P.i!=null&&P.L<3?`<button class="btn y" onclick="start(${P.g},${P.i},${P.L+1})">Level berikutnya ➜</button>`:''}<button class="btn s" onclick="${P.g>100?"go('home')":`go('kelas',${P.g})`}">Pilih materi lain</button></div>`;
W.val=()=>{let tot=0,bad=[];ALLG.forEach(g=>T[g].forEach((t,i)=>[1,2,3].forEach(L=>{const qs=mk(g,i,L);tot+=qs.length;if(qs.length<25)bad.push(`${gname(g)} ${t.n} L${L}: hanya ${qs.length} soal unik`);qs.forEach((q,j)=>{if(!q.o.includes(q.a)||new Set(q.o).size!=q.o.length||q.o.length<4)bad.push(`${gname(g)} ${t.n} L${L} #${j+1}: opsi bermasalah`)})})));return`<h1>🧪 Validator Soal</h1><div class=card><div class=big>${tot} soal dibuat</div><p>${bad.length?'⚠️ '+bad.length+' temuan':'✅ Semua soal lolos'}</p><p class=mu>Cek: 25 soal unik per level, jawaban benar ada di opsi, opsi tidak ganda dan berjumlah 4.</p>${bad.slice(0,40).map(b=>`<div class=mu>⚠️ ${esc(b)}</div>`).join('')}</div>`};

let GD={st:{},pr:{}},GF={skl:'',kls:'',q:'',d:null},GOK=false,gsub=false;
const isOn=p=>!!p&&p.isOnline===true&&(Date.now()+off-(p.last_changed||0))<90000;
function gSub(){if(!db||gsub)return;gsub=true;authP.then(()=>{db.ref(APP+'/ringkas').on('value',s=>{GD.st=s.val()||{};gUp()});db.ref(APP+'/presence').on('value',s=>{GD.pr=s.val()||{};gUp()})});setInterval(gUp,15000)}
function gUp(){if(V=='guru'&&GOK)gTab();if(V=='gdet'){const e=$('#gds');if(e)e.innerHTML=isOn(GD.pr[GF.d])?'🟢 Online':'⚪ Offline · terakhir '+dt((GD.pr[GF.d]||{}).last_changed)}}
function gOpt(id,vals,lbl,cur){const e=$(id);if(!e)return;e.innerHTML=`<option value="">${lbl}</option>`+vals.map(v=>`<option${v==cur?' selected':''}>${esc(v)}</option>`).join('')}
function gTab(){const ks=Object.keys(GD.st),sv2=x=>[...new Set(ks.map(k=>GD.st[k][x]).filter(Boolean))].sort();gOpt('#gsk',sv2('skl'),'Semua sekolah',GF.skl);gOpt('#gkl',sv2('kls'),'Semua kelas',GF.kls);const q=GF.q.toLowerCase(),rows=ks.map(k=>({k,d:GD.st[k],o:isOn(GD.pr[k]),lc:(GD.pr[k]||{}).last_changed||0})).filter(r=>(!GF.skl||r.d.skl==GF.skl)&&(!GF.kls||r.d.kls==GF.kls)&&(!q||(r.d.name||'').toLowerCase().includes(q))).sort((a,b)=>b.o-a.o||(a.d.name||'').localeCompare(b.d.name||''));
$('#gsm').innerHTML=`🟢 <b>${rows.filter(r=>r.o).length}</b> online · ${rows.length} siswa tampil dari ${ks.length}`;
$('#gt').innerHTML=rows.map(r=>{const d=r.d,a=d.tot?Math.round(d.ok/d.tot*100):0;return`<tr><td>${r.o?'🟢 Online':'⚪ Offline'}<td><b>${esc(d.name)}</b><td>${esc(d.kls)}<td>${esc(d.skl)}<td>${d.xp||0}<td>${d.tot||0}<td>${a}%<td>${r.o?'sekarang':dt(r.lc||d.upd)}<td><button class="btn s" onclick="gDet('${r.k}')">Detail</button>`}).join('')||'<tr><td colspan=9>Belum ada data siswa.'}
function gDet(k){GF.d=k;GD.dt=0;go('gdet');authP.then(()=>db.ref(APP+'/detail/'+k).get()).then(sn=>{GD.dt=sn.val();if(V=='gdet')render()}).catch(()=>{GD.dt=null;if(V=='gdet')render()})}
function gpin(){if($('#gp').value==GURU_PIN){GOK=true;render()}else $('#gm').textContent='PIN salah.'}
W.guru=()=>{if(!GOK)return`<div class=card style="max-width:400px;margin:30px auto;text-align:center"><div class=big>👩‍🏫</div><h1>Dashboard Guru</h1><input id=gp type=password class=inp placeholder="PIN guru" onkeydown="event.key=='Enter'&&gpin()"><button class=btn onclick=gpin()>Masuk</button><p class=mu id=gm></p></div>`;if(!db)return`<h1>👩‍🏫 Dashboard Guru</h1><div class=card>Firebase belum dikonfigurasi. Isi <code>FB_CONFIG</code> di bagian script agar monitoring realtime aktif.</div>`;gSub();setTimeout(gTab,0);return`<h1>👩‍🏫 Dashboard Guru</h1><div class=card><div class=row style="flex-wrap:wrap;gap:8px"><select id=gsk class=inp onchange="GF.skl=this.value;gTab()"></select><select id=gkl class=inp onchange="GF.kls=this.value;gTab()"></select><input class=inp placeholder="🔍 Cari nama siswa" value="${esc(GF.q)}" oninput="GF.q=this.value;gTab()"></div><p class=mu id=gsm></p></div><div class="card tw"><table><tr><td><b>Status<td><b>Nama<td><b>Kelas<td><b>Sekolah<td><b>XP<td><b>Soal<td><b>Akurasi<td><b>Terakhir aktif<td><b>Aksi<tbody id=gt></tbody></table></div>`};
W.gdet=()=>{const raw=GD.dt;const back=`<button class="btn s" onclick="go('guru')">← Kembali ke daftar</button>`;if(raw===0)return back+'<div class=card>⏳ Memuat detail…</div>';if(!raw)return back+'<div class=card>Data siswa tidak ditemukan.</div>';const d=norm(raw),pc=(o,t)=>t?Math.round(o/t*100):null,col=x=>x==null?'':x<60?'color:#d62828;font-weight:800':'color:#1b8a4b;font-weight:800';
const babs=ALLG.map(g=>{let o=0,t=0;Object.entries(d.ac).forEach(([k,v])=>{if(k.split('_')[0]==g){o+=v[0];t+=v[1]}});return[g,o,t]}).filter(b=>b[2]>0),weak=[];
const rows=ALLG.flatMap(g=>T[g].map((t,i)=>{let any=0;const c=[1,2,3].map(L=>{const v=d.ac[g+'_'+i+'_'+L];if(!v)return'<td>–';any=1;const x=pc(v[0],v[1]);if(v[1]>=5)weak.push([x,`${gname(g)} · ${t.n} (L${L}) ${x}%`]);return`<td style="${col(x)}">${x}% <span class=mu>(${v[0]}/${v[1]})</span>`}).join('');return any?`<tr><td>${esc(gname(g))} · ${esc(t.n)}${c}`:''}));
return back+`<h1>👤 ${esc(d.name)}</h1><p class=mu>Kelas ${esc(d.kls)} · ${esc(d.skl)} · <span id=gds>${isOn(GD.pr[GF.d])?'🟢 Online':'⚪ Offline · terakhir '+dt((GD.pr[GF.d]||{}).last_changed)}</span></p><div class=grid><div class=card><div class=big>⭐ ${d.xp}</div><div class=mu>XP</div></div><div class=card><div class=big>🔥 ${stk(d.days)}</div><div class=mu>hari beruntun</div></div><div class=card><div class=big>${d.tot}</div><div class=mu>soal dikerjakan</div></div><div class=card><div class=big>${d.tot?Math.round(d.ok/d.tot*100):0}%</div><div class=mu>akurasi</div></div></div>
<h2>📊 Akurasi per bidang</h2>${babs.length?babs.map(b=>{const x=pc(b[1],b[2]);return`<div class=card><div class="row sp"><b>${esc(gname(b[0]))}</b><span style="${col(x)}">${x+'% ('+b[1]+'/'+b[2]+')'}</span></div>${bar(x||0)}</div>`}).join(''):'<div class=card>Belum ada data.</div>'}
<h2>🎯 Akurasi per sub-bab & level</h2><div class="card tw"><table><tr><td><b>Materi<td><b>L1<td><b>L2<td><b>L3${rows.join('')}</table></div>
<h2>⚠️ Perlu bimbingan</h2><div class=card>${weak.sort((a,b)=>a[0]-b[0]).slice(0,5).map(x=>esc(x[1])).join('<br>')||'Belum cukup data (minimal 5 soal per level).'}</div>${hv(d)}`};

let LB=[],lbs=false;
function lbDraw(){const e=$('#lb');if(!e)return;const m=['🥇','🥈','🥉'];e.innerHTML=db?(LB.length?LB.map((x,i)=>`<div class="row sp" style="padding:6px 0;border-bottom:2px dashed var(--ln)"><span>${m[i]||'<b>'+(i+1)+'.</b>'} <b>${esc(x.name)}</b> <span class=mu>${esc(x.kls)} · ${esc(x.skl)}</span></span><b>${x.xp} XP</b></div>`).join(''):'<p class=mu>Belum ada peringkat. Jadilah yang pertama!</p>'):'<p class=mu>Aktifkan Firebase untuk melihat peringkat.</p>'}
function lbSub(){if(db&&!lbs){lbs=true;authP.then(()=>db.ref(APP+'/ringkas').orderByChild('xp').limitToLast(10).on('value',sn=>{const a=[];sn.forEach(c=>{a.push(c.val())});LB=a.reverse();lbDraw()},()=>{LB=[];lbDraw()}))}setTimeout(lbDraw,0);return''}
if(S)resume();
fx();render();
</script></body></html>
